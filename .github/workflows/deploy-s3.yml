name: Deploy site to S3

env:
  RUSTKYLL_VERSION: v0.4.6
  RUSTKYLL_LINUX_AMD64_SHA256: 8a8d05b5056cb34bd59a76f7952be48e7d6cb93782821c4a688f13a7908185f5
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::387546586013:role/dtc-legacy-static-site-publisher
  S3_BUCKET: dtc-legacy-site-387546586013
  CLOUDFRONT_DOMAIN: d5688tx5knzax.cloudfront.net
  # DataTalks.Club Academy (DataTalksClub/academy) is built from its main branch
  # and published under /academy/ (it used to live on academy.datatalks.club).
  ACADEMY_REPO: DataTalksClub/academy
  ACADEMY_API_URL: https://augldvp3omxdxz3irqsmmxc25e0blpxx.lambda-url.eu-west-1.on.aws

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [academy-updated]
  workflow_run:
    workflows: ["generate_all"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: s3-deploy
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rustkyll
        run: |
          mkdir -p .bin
          curl -fsSL \
            "https://github.com/alexeygrigorev/rustkyll/releases/download/${RUSTKYLL_VERSION}/rustkyll-linux-amd64" \
            -o .bin/rustkyll
          echo "${RUSTKYLL_LINUX_AMD64_SHA256}  .bin/rustkyll" | sha256sum -c -
          chmod +x .bin/rustkyll
      - name: Build with Rustkyll
        run: .bin/rustkyll build
        env:
          JEKYLL_ENV: production
      - name: Checkout academy
        uses: actions/checkout@v6
        with:
          repository: ${{ env.ACADEMY_REPO }}
          ref: main
          path: .academy-src
          persist-credentials: false
      - name: Set up Node for academy
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .academy-src/package-lock.json
      - name: Build academy under /academy/
        working-directory: .academy-src
        env:
          SITE_URL: https://datatalks.club
          BASE_PATH: /academy/
          PUBLIC_API_URL: ${{ env.ACADEMY_API_URL }}
          PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.ACADEMY_UMAMI_SCRIPT_URL }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.ACADEMY_UMAMI_WEBSITE_ID }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/sitemap.xml
          if [ -e ../_site/academy ]; then
            echo "::error::_site/academy already exists in the Jekyll build; refusing to overwrite it"
            exit 1
          fi
          cp -R dist ../_site/academy
          echo "academy commit: $(git rev-parse HEAD)"
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-actions-s3-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Sync site to S3
        run: aws s3 sync _site "s3://${S3_BUCKET}" --delete
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --region us-east-1 \
            --query "DistributionList.Items[?DomainName=='${CLOUDFRONT_DOMAIN}'].Id" \
            --output text)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "::error::No CloudFront distribution found for ${CLOUDFRONT_DOMAIN}"
            exit 1
          fi
          aws cloudfront create-invalidation \
            --region us-east-1 \
            --distribution-id "$DIST_ID" \
            --paths "/*"
