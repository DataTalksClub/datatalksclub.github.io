name: generate_all
on:
  # The Airtable forms are closed, so the daily Airtable import is disabled.
  # Website pages are now generated from DataOps instead:
  #   python scripts/dataops.py podcast <episode-id|SxxEyy|slug>
  #   python scripts/dataops.py event --card <card-id> --url URL --time "..." [--type T]
  #   python scripts/dataops.py person --id <person-id>
  #   python scripts/dataops.py book --id <book-id>
  # Manual dispatch is kept for residual one-off runs.
  workflow_dispatch:
    #
jobs:
  generate_all:
    if: github.repository_owner == 'DataTalksClub'
    runs-on: "ubuntu-latest"
    steps:
      - name: install chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser libxss1 \
              fonts-ipafont-gothic fonts-wqy-zenhei \
              fonts-thai-tlwg fonts-kacst fonts-freefont-ttf \
              --no-install-recommends
      - run: chromium-browser --version
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/checkout@v7
      - name: uv install
        run: |
          pip install uv
          uv sync
      - name: npm install
        run: |
          (cd previews && \
            PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install)
      - name: Validate events YAML
        run: uv run python scripts/validate_events_yaml.py
      - name: make all
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_DATABASE: ${{ secrets.AIRTABLE_DATABASE }}
        run: |
          sudo ln -s `which bash` /bin/gitbash
          make all
      - run: |
          ls
          git status
      - uses: EndBug/add-and-commit@v11
